---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: multus-iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "ens19",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.20.0.128/25",
        "routes": [
          {
            "dst": "10.20.0.0/24"
          }
        ]
      }
    }
